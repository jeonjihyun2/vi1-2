/* ===================== 工具函数 ===================== */
function $(id){ return document.getElementById(id); }

function getQuestions(){
  const age = state.answers[1];
  if(age === "18-23"){
    return { questions: [...COMMON_QUESTIONS, ...STUDENT_QUESTIONS], branch: "student" };
  }
  return { questions: [...COMMON_QUESTIONS, ...ADULT_QUESTIONS], branch: "adult" };
}

function calcScore(){
  const { questions, branch } = getQuestions();
  let total = 0, maxScore = 0;
  const answerRecords = [];

  questions.forEach(q=>{
    maxScore += Math.max(...q.options.map(o=>o.score));
    const selectedValue = state.answers[q.id];
    if(selectedValue){
      const option = q.options.find(o=>o.value === selectedValue);
      if(option){
        total += option.score;
        answerRecords.push({ question_id: q.id, question_title: q.title, value: option.value, score: option.score });
        return;
      }
    }
    answerRecords.push({ question_id: q.id, question_title: q.title, value: "未作答", score: 0 });
  });

  const scorePercentage = Math.round((total / maxScore) * 100);
  const riskLevel = scorePercentage >= 70 ? "low" : scorePercentage >= 50 ? "medium" : "high";

  return { total, maxScore, scorePercentage, riskLevel, answerRecords, questions, branch };
}

function has(answers, qId, ...targetValues){
  return targetValues.includes(answers[qId]);
}

    overall = "⚠️ 你的背景属于中等风险，存在部分薄弱点。签证官会重点核查你的回国约束力，建议针对性补齐证明材料，提前准备面试问答，规避敏感表述。";

  const strengthRules = [];
  const riskRules = [];

  if(branch === "adult"){
    strengthRules.push(
      [a=>has(a,1,"31-45"),"年龄31-45岁，处于事业稳定黄金期，回国约束力较强"],
      [a=>has(a,3,"first-tier"),"一线城市户籍，国内经济与社会根基稳定"],
      [a=>has(a,4,"married"),"已婚，家庭构成强回国约束"],
      [a=>has(a,5,"approved-valid"),"曾获批有效美签，签证信用良好"],
      [a=>has(a,6,"developed","multi-developed"),"拥有发达国家出境记录，良好旅行信用"],
      [a=>has(a,12,"employed"),"在职，稳定工作是核心回国约束力"],
      [a=>has(a,13,"gov-soe","foreign"),"就职国企/外企，工作稳定性强"],
      [a=>has(a,14,">50k"),"月收入高，经济实力充足"],
      [a=>has(a,15,"5-10y",">10y"),"工作年限长，国内职业根基牢固"],
      [a=>has(a,16,"master","phd"),"高学历，国内职业发展空间好"],
      [a=>has(a,17,"one","multiple"),"拥有国内房产，固定资产证明充分"],
      [a=>has(a,19,"50-100w",">100w"),"银行存款充足，资金证明有力"],
      [a=>has(a,20,"one","multiple"),"有子女，家庭牵挂增强回国约束"],
      [a=>has(a,23,"self"),"本次出行全部费用自费，资金可信度高"]
    );
    riskRules.push(
      [a=>has(a,1,"60+"),"60岁以上，需要准备健康与资金证明"],
      [a=>has(a,3,"rural-county"),"县城农村户籍，国内社会约束力偏弱"],
      [a=>has(a,5,"rejected"),"存在美签拒签历史，审核会更严格"],
      [a=>has(a,9,"immediate","spouse-child","plan-immigrate"),"美国有直系亲属，移民倾向风险提升"],
      [a=>has(a,12,"unemployed","student"),"失业/学生身份，缺少稳定工作约束"],
      [a=>has(a,13,"sm-private","freelance"),"中小民企/自由职业，稳定性偏弱"],
      [a=>has(a,14,"<5k","5-10k"),"收入偏低，资金证明说服力弱"],
      [a=>has(a,15,"<1y","1-3y"),"工作时间短，国内职业根基不稳"],
      [a=>has(a,16,"high","college"),"学历偏低，国内发展空间有限"],
      [a=>has(a,17,"none"),"无国内房产，缺少固定资产约束"],
      [a=>has(a,19,"<5w","5-20w"),"存款不足，资金证明薄弱"],
      [a=>has(a,23,"family"),"由家人承担全部费用，约束力下降"]
    );
  } else {
    strengthRules.push(
      [a=>has(a,12,"sophomore","junior"),"大二/大三在读，学业状态稳定"],
      [a=>has(a,13,"c9","985","211"),"就读国内重点高校，学术约束力强"],
      [a=>has(a,15,"very-rich","good"),"父母经济条件良好，资金保障充足"],
      [a=>has(a,16,"gov-soe","foreign-pro"),"父母职业稳定，国内家庭根基强"],
      [a=>has(a,17,"one","multiple"),"家庭拥有房产，固定资产充足"],
      [a=>has(a,19,"top10","top30"),"学业成绩优秀，国内学业约束力强"],
      [a=>has(a,20,"6-12m",">1y"),"拥有实习经历，国内职业规划清晰"],
      [a=>has(a,21,"return-cn"),"明确毕业后回国发展，消除移民倾向"],
      [a=>has(a,22,"award"),"拥有竞赛/学术成果，背景优秀"],
      [a=>has(a,23,"only-child"),"独生子女，家庭牵挂在国内"]
    );
    riskRules.push(
      [a=>has(a,12,"freshman","senior"),"大一/大四，学业稳定性偏弱"],
      [a=>has(a,13,"private","college"),"民办/专科院校，学术约束力弱"],
      [a=>has(a,15,"fair","poor"),"家庭经济条件一般/困难，资金证明压力大"],
      [a=>has(a,16,"farmer-worker"),"父母务工务农，国内根基偏弱"],
      [a=>has(a,17,"none"),"家庭无房产，缺少固定资产支撑"],
      [a=>has(a,19,"low"),"学业成绩较差，国内学业约束不足"],
      [a=>has(a,20,"none"),"无实习经历，国内职业规划模糊"],
      [a=>has(a,21,"uncertain","work-us"),"毕业后规划不确定/希望留美工作，移民倾向风险高"],
      [a=>has(a,22,"none"),"无课外活动，背景亮点不足"],
      [a=>has(a,23,"multi-sibling"),"多名兄弟姐妹，家庭国内牵挂偏弱"]
    );
  }

  const strengths = [];
  for(const [fn, text] of strengthRules){
    if(fn(state.answers)) strengths.push(text);
    if(strengths.length >= 6) break;
  }
  if(strengths.length === 0) strengths.push("暂无明显加分项，建议挖掘自身国内约束证据。");

  const risks = [];
  for(const [fn, text] of riskRules){
    if(fn(state.answers)) risks.push(text);
    if(risks.length >= 6) break;
  }
  if(risks.length === 0) risks.push("无明显风险点，保持材料真实，面试简洁诚实。");

  const suggestions = [];
  if(riskLevel === "low"){
    suggestions.push("面试自信、诚实，回答简洁，不要主动多说额外信息");
    suggestions.push("所有申请材料保证真实，不要编造资产、出境记录");
    suggestions.push("提前演练高频面试问题，控制回答时长");
  } else if(riskLevel === "medium"){
    suggestions.push("重点补强国内约束力证明：房产、存款、在职证明、家庭材料");
    suggestions.push("面试回答紧扣“一定会回国”，不要提及任何留美想法");
    suggestions.push("材料全部准备原件，面谈时按需主动出示");
  } else {
    suggestions.push("建议暂缓申请，优先补齐国内约束力短板，不要盲目递签");
    suggestions.push("梳理薄弱项，积累出境记录、资产、稳定工作等加分背景");
    suggestions.push("如果存在拒签史，一定要深度复盘上次拒签原因再二次申请");
  }

  return { overall, strengths, risks, suggestions };
}

/* ===================== 页面渲染 ===================== */
function render(){
  const app = $("app");
  if(state.page === "home") app.innerHTML = renderHome();
  if(state.page === "quiz") app.innerHTML = renderQuiz();
  if(state.page === "result") app.innerHTML = renderResult();
  bindEvents();
}

    <div class="bg-white rounded-2xl border border-gray-50 shadow-sm p-5">

function stepCard(num, title, desc){

function renderQuiz(){
  const { questions, branch } = getQuestions();
  state.questions = questions;
  state.branch = branch;

  if(questions.length === 0){
    return `<div class="text-center py-20 text-gray-500">加载题目失败</div>`;
  }

  const currentQ = questions[state.currentIndex];
  const total = questions.length;
  const progress = ((state.currentIndex + 1) / total) * 100;
  const selectedValue = state.answers[currentQ.id];
  const isLast = state.currentIndex === total - 1;

  return `
    <div>
      <!-- 吸顶进度条 -->
      <div class="sticky top-0 z-30 bg-white border-b border-gray-100 rounded-t-2xl shadow-sm">
        <div class="max-w-2xl mx-auto px-4 py-3 flex items-center gap-3">
          <button id="goPrev" class="text-gray-600 hover:text-primary text-lg">←</button>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between text-sm">
              <span class="text-gray-500 tabular-nums">${String(state.currentIndex+1).padStart(2,"0")} / ${String(total).padStart(2,"0")}</span>
              <span class="text-gray-400">${branch === "student" ? "学生版" : "成人版"}</span>
            </div>
            <div class="text-gray-900 font-semibold truncate mt-1">${currentQ.title}</div>
          </div>
        </div>
        <div class="h-[1.5px] bg-gray-100">
          <div class="progress-bar-fill h-full bg-primary" style="width:${progress}%"></div>
        </div>
      </div>

      <!-- 题目区 -->
      <div class="max-w-2xl mx-auto px-4 py-6">
        <h2 class="text-xl font-bold text-gray-900">${currentQ.title}</h2>

        ${currentQ.rationale ? `
          <div class="mt-4 bg-red-50 border border-red-200 rounded-xl p-4 text-sm text-red-600">
            <div class="font-bold mb-1">⚠️ 评分原理</div>
            <div class="mb-2">${currentQ.rationale.body}</div>
            <ul class="space-y-1 list-disc pl-5">
              ${currentQ.rationale.warnings.map(w=>`<li>${w}</li>`).join("")}
            </ul>
          </div>
        ` : ""}

        <div class="mt-5 space-y-3">
          ${currentQ.options.map(opt=>`
            <button class="option-btn w-full text-left p-4 rounded-xl border-2 ${selectedValue === opt.value ? "border-primary bg-blue-50 text-primary font-semibold" : "border-gray-100 bg-white hover:border-gray-200"}" data-value="${opt.value}">
              <div class="flex items-center justify-between">
                <span>${opt.label}</span>
                ${selectedValue === opt.value ? `<span class="w-6 h-6 rounded-full bg-primary text-white flex items-center justify-center text-xs">✓</span>` : ""}
              </div>
            </button>
          `).join("")}
        </div>

        <!-- BUTTONS MOVED DIRECTLY UNDER OPTIONS, NO FIXED BOTTOM -->
        <div class="mt-6 flex gap-3">
          <button id="goPrevBottom" class="flex-1 bg-white border border-gray-200 text-gray-700 py-3 rounded-xl font-medium hover:bg-gray-50">
            ← 上一题
          </button>
          ${isLast ? `
            <button id="submitQuiz" class="flex-1 bg-primary hover:bg-primary-hover text-white py-3 rounded-xl font-medium ${selectedValue ? "" : "opacity-50 cursor-not-allowed"}">
              提交评估
            </button>
          ` : `
            <button id="goNext" class="flex-1 bg-primary hover:bg-primary-hover text-white py-3 rounded-xl font-medium ${selectedValue ? "" : "opacity-50 cursor-not-allowed"}">
              下一题 →
            </button>
          `}
        </div>
      </div>
    </div>
  `;
}

function renderResult(){
  if(!state.result){
    state.result = calcScore();
  }
  const { total, maxScore, scorePercentage, riskLevel, answerRecords, branch } = state.result;
  const analysis = generatePresetAnalysis(scorePercentage, riskLevel, state.answers, branch);

  const riskText = riskLevel === "low" ? "低风险" : riskLevel === "medium" ? "中风险" : "高风险";
  const riskColor = riskLevel === "low" ? "#22c55e" : riskLevel === "medium" ? "#eab308" : "#ef4444";

  const circumference = 2 * Math.PI * 70;
  const offset = circumference - (scorePercentage / 100) * circumference;

  return `
    <div>
      <div class="max-w-2xl mx-auto px-4 pt-4">
        <div class="flex items-center justify-between">
          <button id="backToHome" class="text-gray-600 hover:text-primary text-sm font-medium">← 返回首页</button>
          <span class="text-primary text-sm font-semibold">评估报告</span>
        </div>
      </div>

      <!-- 分数圆环卡片 -->
      <div class="max-w-2xl mx-auto px-4 mt-4">
        <div class="bg-white rounded-2xl border border-gray-50 shadow-sm p-8 text-center">
          <div class="relative inline-flex items-center justify-center">
            <svg width="180" height="180">
              <circle class="ring-bg" cx="90" cy="90" r="70" stroke-width="12" fill="none"/>
              <circle class="ring-progress" cx="90" cy="90" r="70" stroke="${riskColor}" stroke-width="12" fill="none"
                stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center">
              <div class="text-4xl font-bold text-gray-900">${scorePercentage}%</div>
              <div class="text-xs text-gray-500 mt-1">通过率评估</div>
            </div>
          </div>

          <div class="mt-4 flex items-center justify-center gap-2">
            <span class="px-3 py-1 rounded-full text-xs font-bold" style="background:${riskColor}22;color:${riskColor}">
              ${riskText}
            </span>
          </div>
          <div class="text-sm text-gray-500 mt-2">总分 ${total} / ${maxScore}</div>
        </div>
      </div>

      <!-- 总体评估 -->
      <div class="max-w-2xl mx-auto px-4 mt-4">
        <div class="bg-white rounded-2xl border border-gray-50 shadow-sm p-6">
          <h3 class="font-bold text-gray-900 mb-3">总体评估</h3>
          <p class="text-gray-700 text-sm leading-relaxed">${analysis.overall}</p>

          <div class="mt-5">
            <div class="flex items-center gap-2 text-green-600 font-semibold mb-2">
              <span>✅</span> 竞争优势
            </div>
            <ul class="space-y-1 text-sm text-gray-700 list-disc pl-5">
              ${analysis.strengths.map(s=>`<li>${s}</li>`).join("")}
            </ul>
          </div>

          <div class="mt-5">
            <div class="flex items-center gap-2 text-yellow-600 font-semibold mb-2">
              <span>⚠️</span> 风险点
            </div>
            <ul class="space-y-1 text-sm text-gray-700 list-disc pl-5">
              ${analysis.risks.map(r=>`<li>${r}</li>`).join("")}
            </ul>
          </div>

          <div class="mt-5">
            <div class="flex items-center gap-2 text-primary font-semibold mb-2">
              <span>💡</span> 改善建议
            </div>
            <ul class="space-y-1 text-sm text-gray-700 list-disc pl-5">
              ${analysis.suggestions.map(s=>`<li>${s}</li>`).join("")}
            </ul>
          </div>
        </div>
      </div>

      <!-- 底部按钮 -->
      <div class="max-w-2xl mx-auto px-4 mt-6 mb-10 grid grid-cols-2 gap-3">
        <button id="restartQuiz" class="bg-white border border-gray-200 text-gray-700 py-3 rounded-xl font-medium hover:bg-gray-50">
          🔄 重新测评
        </button>
        <button id="backToHomeEnd" class="bg-primary hover:bg-primary-hover text-white py-3 rounded-xl font-medium">
          返回首页
        </button>
      </div>
    </div>
  `;
}

/* ===================== 事件绑定 ===================== */
function bindEvents(){
  $("startQuiz")?.addEventListener("click", ()=>{
    state.page = "quiz";
    state.currentIndex = 0;
    render();
  });

  document.querySelectorAll(".option-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const value = btn.dataset.value;
      state.answers[state.questions[state.currentIndex].id] = value;
      render();
    });
  });

  $("goPrev")?.addEventListener("click", goPrev);
  $("goPrevBottom")?.addEventListener("click", goPrev);
  $("goNext")?.addEventListener("click", goNext);
  $("submitQuiz")?.addEventListener("click", submitQuiz);
  $("backToHome")?.addEventListener("click", backToHome);
  $("backToHomeEnd")?.addEventListener("click", backToHome);
  $("restartQuiz")?.addEventListener("click", ()=>{
    state.answers = {};
    state.result = null;
    state.page = "quiz";
    state.currentIndex = 0;
    render();
  });
}

function goPrev(){
  if(state.currentIndex === 0){
    backToHome();
  } else {
    state.currentIndex--;
    render();
  }
}

function goNext(){
  const currentQ = state.questions[state.currentIndex];
  if(!state.answers[currentQ.id]) return;
  state.currentIndex++;
  render();
}

function submitQuiz(){
  const currentQ = state.questions[state.currentIndex];
  if(!state.answers[currentQ.id]) return;
  state.page = "result";
  state.result = null;
  render();
}

function backToHome(){
  state.page = "home";
  state.answers = {};
  state.currentIndex = 0;
  state.result = null;
  render();
}

/* ===================== 启动 ===================== */
render();
</script>
